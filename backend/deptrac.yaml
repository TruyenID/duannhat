# GENERATED by `php artisan architecture:deptrac-config` — DO NOT EDIT BY HAND.
# Source of truth: backend/config/modules.php (#962 / #1532).
#
# Deptrac replaces the hand-rolled edge counter it used to have. The old one
# kept ONE total per module pair in a single JSON file, so two unrelated PRs
# collided on the same line — 6 of 9 PRs conflicted there on 2026-08-01.
# Deptrac baselines each violation separately, so that collision cannot occur.
# Per-violation baseline (#1532). THIS is the property the old single-number
# file lacked: each class gets its own block, so two PRs paying down debt in
# different classes edit different lines and never collide. Regenerate with
#   deptrac analyse --formatter=baseline -o deptrac-baseline.yaml
# and say in the commit WHY anything was added — the file only shrinks.
imports:
  - ./deptrac-baseline.yaml
deptrac:
  paths:
    - ./app
  exclude_files:
    # Generated by Omnify and stamped "DO NOT EDIT". 1016 files whose shape is
    # the generator's decision, not the team's: a boundary violation in there
    # cannot be refactored (regen overwrites it) and says nothing about how
    # anyone writes code. Measuring them made the count jump 224 → 5809 without
    # adding one actionable item. The hand-written wrappers in App\Models stay
    # covered — that is where the real decisions live.
    - '#app/Omnify/Modules/.*#'
  layers:
    # Technical shared code — helpers, casts, traits, providers. Not a domain.
    - name: SharedKernel
      collectors:
        - type: classNameRegex
          value: '#^App\\Modules\\Kernel\\#'
        - type: classNameRegex
          value: '#^App\\Support\\#'
        - type: classNameRegex
          value: '#^App\\Casts\\#'
        - type: bool
          must:
            - type: classNameRegex
              value: '#^App\\Concerns\\#'
          must_not:
            - type: classNameRegex
              value: '#^App\\Concerns\\HasApprovalWorkflow$#'
        - type: bool
          must:
            - type: classNameRegex
              value: '#^App\\Traits\\#'
          must_not:
            - type: classNameRegex
              value: '#^App\\Traits\\AuditsActivity$#'
        - type: classNameRegex
          value: '#^App\\Rules\\#'
        - type: classNameRegex
          value: '#^App\\Exceptions\\#'
        - type: classNameRegex
          value: '#^App\\Architecture\\#'
        - type: classNameRegex
          value: '#^App\\Omnify\\Enums\\#'
        - type: bool
          must:
            - type: classNameRegex
              value: '#^App\\Services\\Omnify\\#'
          must_not:
            - type: classNameRegex
              value: '#^App\\Services\\Omnify\\AllergenService$#'
            - type: classNameRegex
              value: '#^App\\Services\\Omnify\\PaymentMethodService$#'
            - type: classNameRegex
