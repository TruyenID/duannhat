var FullFeaturedWorker;

function createWorker(workerFunc) {
  var functionString = workerFunc.toString();
  var functionBody = functionString.trim().match(
    /^function\s*\w*\s*\([\w\s,]*\)\s*\{([\w\W]*?)\}$/
  )[1];
  var blob = new Blob([functionBody], { type: "text/javascript" });
  var url = URL.createObjectURL(blob);
  return new Worker(url);
}

function sendToRN(msg) {
  var s = JSON.stringify(msg);
  // Kiosk (react-native-webview) path, kept for parity.
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(s);
    return;
  }
  // Workstation (web iframe) path: post to the parent window so the
  // <TerminalBridge> React component receives RESULT/ERROR/STATUS_EVENT.
  if (window.parent && window.parent !== window) {
    window.parent.postMessage(s, "*");
  }
}

function doRequestWorker(host, port, request) {
  FullFeaturedWorker.postMessage({ host: host, port: port, request: request });
}

function doCancelWorker() {
  if (FullFeaturedWorker) {
    FullFeaturedWorker.postMessage({ request: { Cancel: true } });
  }
}

function attachWorkerHandlers(worker) {
  worker.onmessage = function(e) {
    // Worker sends WORKER_INIT when its code has actually executed
    if (e.data && e.data.type === 'WORKER_INIT') {
      sendToRN({ type: 'READY' });
      return;
    }
    if (e.data !== "undefined") {
      if (e.data.StatusEvent != null) {
        sendToRN({ type: 'STATUS_EVENT', data: e.data.StatusEvent });
        return;
      }
    }
    if (e.data.OutputCompleteEvent != null) {
      sendToRN({ type: 'RESULT', data: e.data });
    } else if (e.data.ErrorEvent != null) {
      sendToRN({ type: 'ERROR', data: e.data });
    }
  };

  worker.onerror = function(e) {
    sendToRN({ type: 'INIT_ERROR', message: e.message || 'Worker error' });
  };
}

  FullFeaturedWorker = createWorker(vescajs);
  attachWorkerHandlers(FullFeaturedWorker);
}

function doForceReset() {
  try {
    if (FullFeaturedWorker) { FullFeaturedWorker.terminate(); }
  } catch (e) { /* terminate is best-effort */ }
  try {
    initWorker();
  } catch (e) {
    sendToRN({ type: 'INIT_ERROR', message: 'Force reset failed: ' + e.message });
  }
