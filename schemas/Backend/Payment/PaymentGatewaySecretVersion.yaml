# =============================================================================
# PaymentGatewaySecretVersion — server-only encrypted provider secret version
# =============================================================================
# Hidden internal schema. Never expose through resources/services/routes. Ciphertext is
# authenticated against tenant, connection, provider, environment, purpose, version,
# reference and key ID. Master keys never enter this table.
# =============================================================================

displayName: { en: Payment Gateway Secret Version, ja: 決済ゲートウェイシークレットバージョン, vi: Phiên bản bí mật cổng thanh toán }
kind: object

options:
  id: Uuid
  timestamps: false
  softDelete: false
  hidden: true
  service: false
  indexes:
    - columns: [connection_id, purpose, version]
      unique: true
      name: gateway_secret_connection_purpose_version_unique
    - columns: [organization_id, connection_id, provider_code, environment, purpose, state]
      name: gateway_secret_authorized_lookup

properties:
  organization:
    type: Association
    relation: ManyToOne
    target: Organization
    onDelete: RESTRICT
    hidden: true
    displayName: { en: Organization, ja: 組織, vi: Tổ chức }
  connection:
    type: Association
    relation: ManyToOne
    target: PaymentGatewayConnection
    onDelete: RESTRICT
    hidden: true
    displayName: { en: Connection, ja: 接続, vi: Kết nối }
  provider_code:
    type: EnumRef
    enum: PaymentGatewayProviderCode
    hidden: true
    displayName: { en: Provider, ja: プロバイダー, vi: Nhà cung cấp }
  environment:
    type: EnumRef
    enum: PaymentGatewayEnvironment
    hidden: true
    displayName: { en: Environment, ja: 環境, vi: Môi trường }
  purpose:
    type: String
    length: 20
    hidden: true
    displayName: { en: Purpose, ja: 用途, vi: Mục đích }
  version:
    type: Int
    unsigned: true
    rules: { min: 1 }
    hidden: true
    displayName: { en: Version, ja: バージョン, vi: Phiên bản }
  key_id:
    type: String
    length: 80
    hidden: true
    displayName: { en: Master Key ID, ja: マスターキーID, vi: ID khóa chính }
  nonce:
    # Base64 of the exact 24-byte XChaCha20 nonce; avoids text-connection binary coercion.
    type: String
    length: 32
    hidden: true
    displayName: { en: Nonce, ja: ノンス, vi: Nonce }
  ciphertext:
    type: LongText
    hidden: true
    displayName: { en: Ciphertext, ja: 暗号文, vi: Bản mã }
  fingerprint:
    type: String
    length: 64
    hidden: true
    displayName: { en: Keyed Fingerprint, ja: キー付きフィンガープリント, vi: Dấu vân tay có khóa }
  state:
    type: String
    length: 20
    hidden: true
    displayName: { en: State, ja: 状態, vi: Trạng thái }
  valid_until:
    type: Timestamp
    nullable: true
    hidden: true
    displayName: { en: Valid Until, ja: 有効期限, vi: Có hiệu lực đến }
  created_at:
    type: Timestamp
    useCurrent: true
    hidden: true
    displayName: { en: Created At, ja: 作成日時, vi: Tạo lúc }
  revoked_at:
    type: Timestamp
    nullable: true
    hidden: true
    displayName: { en: Revoked At, ja: 失効日時, vi: Thu hồi lúc }
