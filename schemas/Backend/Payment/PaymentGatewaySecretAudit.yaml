# =============================================================================
# PaymentGatewaySecretAudit — server-only append-only rotation/revocation audit
# =============================================================================
# Hidden internal schema. It contains only safe scope/version/fingerprint/reference-hash
# evidence and never plaintext, ciphertext, nonce, raw secret reference or provider payload.
# Database triggers are installed by the guarded operational command after migrations.
# =============================================================================

displayName: { en: Payment Gateway Secret Audit, ja: 決済ゲートウェイシークレット監査, vi: Kiểm tra bí mật cổng thanh toán }
kind: object

options:
  id: Uuid
  timestamps: false
  softDelete: false
  hidden: true
  service: false
  indexes:
    - columns: [organization_id, connection_id, purpose, created_at]
      name: gateway_secret_audit_lookup

properties:
  organization:
    type: Association
    relation: ManyToOne
    target: Organization
    onDelete: RESTRICT
    hidden: true
    displayName: { en: Organization, ja: 組織, vi: Tổ chức }
  connection:
    type: Association
    relation: ManyToOne
    target: PaymentGatewayConnection
    onDelete: RESTRICT
    hidden: true
    displayName: { en: Connection, ja: 接続, vi: Kết nối }
  provider_code:
    type: EnumRef
    enum: PaymentGatewayProviderCode
    hidden: true
    displayName: { en: Provider, ja: プロバイダー, vi: Nhà cung cấp }
  environment:
    type: EnumRef
    enum: PaymentGatewayEnvironment
    hidden: true
    displayName: { en: Environment, ja: 環境, vi: Môi trường }
  purpose:
    type: String
    length: 20
    hidden: true
    displayName: { en: Purpose, ja: 用途, vi: Mục đích }
  action:
    type: String
    length: 20
    hidden: true
    displayName: { en: Action, ja: アクション, vi: Hành động }
  old_version:
    type: Int
    unsigned: true
    nullable: true
    hidden: true
    displayName: { en: Old Version, ja: 旧バージョン, vi: Phiên bản cũ }
  new_version:
    type: Int
    unsigned: true
    nullable: true
    hidden: true
    displayName: { en: New Version, ja: 新バージョン, vi: Phiên bản mới }
  key_id:
    type: String
    length: 80
    nullable: true
    hidden: true
    displayName: { en: Master Key ID, ja: マスターキーID, vi: ID khóa chính }
  old_ref_hash:
    type: String
    length: 64
    nullable: true
    hidden: true
    displayName: { en: Old Reference Hash, ja: 旧参照ハッシュ, vi: Hash tham chiếu cũ }
  new_ref_hash:
    type: String
    length: 64
    nullable: true
    hidden: true
    displayName: { en: New Reference Hash, ja: 新参照ハッシュ, vi: Hash tham chiếu mới }
  old_fingerprint:
    type: String
    length: 64
    nullable: true
    hidden: true
    displayName: { en: Old Keyed Fingerprint, ja: 旧キー付きフィンガープリント, vi: Dấu vân tay cũ có khóa }
  new_fingerprint:
    type: String
    length: 64
    nullable: true
    hidden: true
    displayName: { en: New Keyed Fingerprint, ja: 新キー付きフィンガープリント, vi: Dấu vân tay mới có khóa }
  actor_id:
    type: String
    length: 191
    hidden: true
    displayName: { en: Actor ID, ja: 実行者ID, vi: ID người thực hiện }
  correlation_id:
    type: String
    length: 191
    hidden: true
    displayName: { en: Correlation ID, ja: 相関ID, vi: ID tương quan }
  overlap_until:
    type: Timestamp
    nullable: true
    hidden: true
    displayName: { en: Overlap Until, ja: 重複許可期限, vi: Cho phép chồng lấn đến }
  created_at:
    type: Timestamp
    useCurrent: true
    hidden: true
    displayName: { en: Created At, ja: 作成日時, vi: Tạo lúc }
