# Bảng nối role ↔ permission. Cặp là duy nhất; xoá role hoặc permission thì
# hàng nối đi theo (CASCADE).
kind: pivot
pivotFor: [Role, Permission]

options:
  # Đặt tên rõ ràng: mặc định của pivot là `permission_role_pivot`, còn
  # Role::permissions() / Permission::roles() trỏ tới `role_permissions`.
  tableName: role_permissions
  timestamps: true
  indexes:
    - columns: [role_id, permission_id]
      unique: true
      name: role_permissions_role_permission_unique
