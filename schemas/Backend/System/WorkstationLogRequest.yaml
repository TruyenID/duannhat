# =============================================================================
# WorkstationLogRequest (#2901) — một yêu cầu lấy log, treo chờ máy trạm nhận
# =============================================================================
#
# ## "Kéo" KHÔNG thực hiện được theo nghĩa đen
#
# Cloud **không gọi ngược vào máy trạm được**: máy trạm chạy `http.Server` trên
# LAN của quán, sau NAT, không có địa chỉ công khai. Mọi liên lạc hiện nay đều
# do máy trạm chủ động gọi ra. Nên "kéo theo yêu cầu" cài thành **yêu cầu treo,
# máy trạm tự nhận**:
#
#   1. Người điều tra bấm "lấy log" ở HQ     → hàng `pending` ra đời ở bảng này
#   2. Máy trạm hỏi ở nhịp sync kế tiếp      → GET /workstation/log-requests
#   3. Máy trạm LỌC tại chỗ rồi ĐẨY LÊN      → POST /workstation/log-records
#                                              lô cuối mang `final: true`
#   4. Cloud đóng yêu cầu                    → status = fulfilled
#
# Tinh thần vẫn đúng ý đã chốt: log không rời quán cho tới khi có người yêu
# cầu. Chỉ khác ở chỗ chiều vận chuyển luôn là máy trạm → Cloud.
#
# ## Đường này CHỈ ĐỌC LOG — không được thành cửa hậu thực thi lệnh
#
# Một yêu cầu mang đúng bốn thứ: khoảng thời gian, trần số bản ghi, thiết bị
# đích, hạn. Không có trường tự do nào, không tên file, không đường dẫn, không
# lệnh. Đây là ràng buộc thiết kế được ghi thẳng vào hình dạng bảng: thêm một
# cột "tham số" tự do là mở lại đúng cửa đã cố ý đóng.
#
# ## `expires_at` là bắt buộc, và nó là phần trả lời cho ca xấu nhất
#
# Máy chết hẳn hoặc mất mạng thì KHÔNG kéo được log — mà đó lại đúng lúc cần
# nhất. Đánh đổi này đã được nói thẳng khi chốt "kéo theo yêu cầu", nên bảng
# phải PHÂN BIỆT được ba câu chuyện, không được gộp:
#
#   pending   — chưa tới hạn, có thể máy trạm sắp trả lời
#   expired   — hết hạn mà không ai trả lời: máy tắt / mất mạng / bản cũ chưa
#               biết endpoint này
#   fulfilled — đã trả lời, và `received_count` nói trả về bao nhiêu dòng
#
# `fulfilled` với `received_count = 0` là một khẳng định thật ("khoảng thời
# gian đó không có dòng nào qua được allowlist"), còn `expired` KHÔNG khẳng
# định gì. Gộp hai thứ đó là bẫy mẫu số bằng không mà issue nêu đích danh:
# Cloud **không được** hiểu "không có log" thành "không có sự cố".
#
# ## KHÔNG FK cứng, cùng lý do với bảng bản ghi
#
# `device_id` / `branch_id` / `organization_id` / `requested_by_user_id` là Uuid
# trần. Một yêu cầu là hồ sơ điều tra: nó phải đọc được sau khi thiết bị bị
# revoke và sau khi người yêu cầu rời tổ chức.
# =============================================================================

displayName:
  en: Workstation Log Request
  ja: ワークステーションログ取得要求
  vi: Yêu cầu lấy log máy trạm

kind: object

options:
  timestamps: true
  softDelete: false
  id: Uuid
  # Không phải tài nguyên CRUD — tạo qua HQ, đóng qua đường sync-UP.
  service: false
  indexes:
    # Phép đọc NÓNG: máy trạm hỏi "có gì cho tôi không" mỗi nhịp sync. Đây là
    # truy vấn chạy nhiều nhất của cả tính năng, nên nó được index đầu tiên.
    - columns: [device_id, status]
    # Màn hình HQ: "quán này đã có ai yêu cầu gì chưa".
    - columns: [branch_id, created_at]
    # Trục quét của lượt đánh dấu hết hạn.
    - columns: [status, expires_at]

properties:
  # ── Thiết bị đích ─────────────────────────────────────────────────────────
  device_id:
    type: Uuid
    displayName:
      en: Device ID
      ja: デバイスID
      vi: ID thiết bị
    description:
      en: The workstation asked to hand over logs. Plain UUID, no FK. A device only ever sees requests carrying its OWN id — a request_id belonging to another device is 422, not 404, because that is a caller mistake and not a missing row.
      ja: ログ提出を求められたワークステーション。FKなし。他デバイスの request_id は422。
      vi: Máy trạm bị hỏi log. Uuid trần, không FK. Một thiết bị chỉ thấy yêu cầu mang CHÍNH id của nó — `request_id` của thiết bị khác là 422 chứ không phải 404, vì đó là lỗi của người gọi chứ không phải hàng không tồn tại.

  branch_id:
    type: Uuid
    displayName:
      en: Branch ID
      ja: 店舗ID
      vi: ID chi nhánh
    description:
      en: Branch of the target device, snapshotted at request time so the audit trail survives a device being re-homed.
      ja: 対象デバイスの店舗（要求時点のスナップショット）。
      vi: Chi nhánh của thiết bị đích, chụp lại lúc tạo yêu cầu để hồ sơ vẫn đọc được nếu thiết bị bị chuyển quán.

  organization_id:
    type: Uuid
    displayName:
      en: Organization ID
      ja: 組織ID
      vi: ID tổ chức
    description:
      en: Local organization mirrored from console_organization_id of the branch (#2847).
      ja: 店舗の console_organization_id からミラーした組織（#2847）。
      vi: Tổ chức local suy qua mirror console của chi nhánh (#2847).

  requested_by_user_id:
    type: Uuid
    nullable: true
    displayName:
      en: Requested By
      ja: 要求者
      vi: Người yêu cầu
    description:
      en: The investigator who created the request. Nullable so a future scheduled/system request can exist without inventing a fake actor — same reasoning as AuditLog.user_id.
      ja: 要求を作成した調査担当者。システム発行を想定して nullable。
      vi: Người điều tra đã tạo yêu cầu. Nullable để một yêu cầu do hệ thống phát về sau không phải bịa ra một tác nhân giả — cùng lý lẽ với `AuditLog.user_id`.

  # ── Phạm vi — cố định, không có trường tự do ──────────────────────────────
  window_from:
    type: DateTime
    displayName:
      en: Window From
      ja: 取得開始日時
      vi: Từ thời điểm
    description:
      en: Inclusive lower bound on the record's own logged_at (UTC). Named window_* rather than from/to because `from`/`to` are reserved words in SQL; the wire contract still spells them "from"/"to".
      ja: 対象ログの logged_at の下限（UTC、含む）。
      vi: Cận dưới (bao gồm) trên `logged_at` của chính bản ghi (UTC). Đặt tên `window_*` vì `from`/`to` là từ khoá SQL; hợp đồng wire vẫn phát ra "from"/"to".

  window_to:
    type: DateTime
    displayName:
      en: Window To
      ja: 取得終了日時
      vi: Đến thời điểm
    description:
      en: Inclusive upper bound on logged_at (UTC).
      ja: 対象ログの logged_at の上限（UTC、含む）。
      vi: Cận trên (bao gồm) trên `logged_at` (UTC).

  max_records:
    type: Int
    displayName:
      en: Max Records
      ja: 最大件数
      vi: Trần số bản ghi
    description:
      en: Ceiling the device must respect for the whole request across every batch. A window can span hours of a busy POS, and an unbounded answer turns one investigation into a bandwidth incident.
      ja: 全バッチ合計の上限件数。
      vi: Trần cho TOÀN BỘ yêu cầu, cộng qua mọi lô. Một khoảng thời gian có thể trùm nhiều giờ bán hàng, và câu trả lời không giới hạn biến một lượt điều tra thành một sự cố băng thông.

  # ── Vòng đời ──────────────────────────────────────────────────────────────
  status:
    type: EnumRef
    enum: WorkstationLogRequestStatus
    filterable: true
    displayName:
      en: Status
      ja: ステータス
      vi: Trạng thái
    description:
      en: pending | fulfilled | expired. Only `pending` (and not past expires_at) is handed to the device.
      ja: pending | fulfilled | expired。デバイスに渡るのは pending かつ未失効のみ。
      vi: pending | fulfilled | expired. Chỉ `pending` và chưa quá `expires_at` mới được trao cho thiết bị.

  expires_at:
    type: DateTime
    displayName:
      en: Expires At
      ja: 有効期限
      vi: Hạn
    description:
      en: After this instant the request is no longer offered and counts as expired. NOT NULL on purpose — a request with no horizon is a standing order for PII to be shipped, which is the opposite of why pull-on-demand was chosen.
      ja: この時刻を過ぎた要求は配布されず expired 扱い。NOT NULL。
      vi: Qua mốc này thì yêu cầu không được trao nữa và tính là hết hạn. NOT NULL có chủ đích — một yêu cầu không hạn là lệnh thường trực chuyển PII, tức ngược hẳn lý do chọn kéo-theo-yêu-cầu.

  fulfilled_at:
    type: DateTime
    nullable: true
    displayName:
      en: Fulfilled At
      ja: 取得完了日時
      vi: Lúc hoàn tất
    description:
      en: When the device sent the batch marked final. Null while pending or expired — that null is permanent semantics (#2618), not missing data.
      ja: final フラグ付きバッチを受け取った時刻。pending/expired の間は null。
      vi: Lúc thiết bị gửi lô đánh dấu `final`. Null khi còn `pending` hoặc đã `expired` — null đó là ngữ nghĩa vĩnh viễn (#2618), không phải dữ liệu thiếu.

  received_count:
    type: Int
    displayName:
      en: Received Count
      ja: 受信件数
      vi: Số bản ghi đã nhận
    description:
      en: Rows actually stored for this request. `fulfilled` with 0 is a real assertion ("nothing in that window passed the allowlist"); `expired` asserts nothing. Keeping them apart is what stops "no logs" being read as "no incident".
      ja: 実際に保存された件数。fulfilled かつ 0 は「該当なし」という主張、expired は無主張。
      vi: Số hàng thực sự đã lưu cho yêu cầu này. `fulfilled` mà 0 là một khẳng định thật ("khoảng đó không dòng nào qua allowlist"); `expired` thì không khẳng định gì. Tách bạch hai thứ đó chính là cái chặn việc đọc "không có log" thành "không có sự cố".

  rejected_count:
    type: Int
    displayName:
      en: Rejected Count
      ja: 却下件数
      vi: Số dòng bị loại
    description:
      en: Lines Cloud dropped because the message was not in the allowlist. A non-zero value is the signal to widen docs/reference/workstation-log-allowlist.md — without it the gap is invisible and the investigator just sees a short answer.
      ja: allowlist 外の message で Cloud が破棄した行数。0 でなければ allowlist を広げる合図。
      vi: Số dòng Cloud bỏ vì `message` không có trong allowlist. Khác 0 là tín hiệu phải mở rộng `docs/reference/workstation-log-allowlist.md` — không có con số này thì lỗ hổng vô hình và người điều tra chỉ thấy một câu trả lời ngắn.
