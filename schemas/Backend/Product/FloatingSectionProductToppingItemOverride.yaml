# =============================================================================
# FloatingSectionProductToppingItemOverride
#   (フローティングセクション商品トッピング項目上書き / Ghi đè Topping khung giờ ưu đãi cấp Shop)
# =============================================================================
#
# Bản sao cấu trúc của MenuProductToppingItemOverride, nhưng scope vào
# FloatingSectionProduct thay vì MenuProduct — vì floating section là "một menu
# thu nhỏ": cùng sản phẩm, cùng SKU, cùng topping, và shop cần override giá phụ
# phí / ẩn-hiện topping riêng cho từng floating section product.
#
# Vị trí trong resolution chain (giống hệt menu):
#
#   shop override_price   (bảng này, scoped theo floating_section_product_id)
#     → HQ override_price   (product_topping_group_item_overrides)   ← dùng chung catalog
#       → HQ base extra_price (topping_group_item_skus)              ← dùng chung catalog
#
# Tier-2 và tier-3 thuộc catalog product nên dùng chung với menu, không nhân đôi.
# Chỉ tier-1 (bảng này) là riêng cho floating section — mirror menu tier-1.
#
# floating_section_product_id scope row vào 1 floating section product của branch
# → mỗi branch/floating section customize độc lập.
#
# product_sku_id nullable = wildcard row: override áp dụng cho mọi SKU của topping
# item này cho floating section product này.
#
# Constraint (application layer): is_hidden = true → override_price PHẢI NULL.
#
# Written by: Shop admin via FloatingSectionToppingOverrideService.
# Read by: resolve effective topping price + visibility per floating section.
# =============================================================================

displayName:
  en: Floating Section Product Topping Item Override
  ja: フローティングセクション商品トッピング項目上書き
  vi: Ghi đè Topping khung giờ ưu đãi cấp Shop

kind: object

options:
  softDelete: false
  timestamps: true
  id: Uuid
  indexes:
    - columns: [floating_section_product_id, topping_group_id, topping_group_item_id, product_sku_id]
      unique: true
      name: uq_fsptio_fsp_group_item_sku
    - columns: [floating_section_product_id]
    - columns: [topping_group_id]
    - columns: [topping_group_item_id]

properties:
  floatingSectionProduct:
    type: Association
    relation: ManyToOne
    target: FloatingSectionProduct
    onDelete: CASCADE
    displayName:
      en: Floating Section Product
      ja: フローティングセクション商品
      vi: Sản phẩm trong khung giờ ưu đãi
    description:
      en: Shop-scoped floating section product this override applies to
      ja: このオーバーライドが適用されるショップスコープのフローティングセクション商品
      vi: Floating section product cấp shop mà override này áp dụng vào

  toppingGroup:
    type: Association
    relation: ManyToOne
    target: ToppingGroup
    onDelete: CASCADE
    displayName:
      en: Topping Group
      ja: トッピンググループ
      vi: Nhóm Topping

  toppingGroupItem:
    type: Association
    relation: ManyToOne
    target: ToppingGroupItem
    onDelete: CASCADE
    displayName:
      en: Topping Group Item
      ja: トッピンググループ項目
      vi: Mục Topping

  productSku:
    type: Association
    relation: ManyToOne
    target: ProductSku
    nullable: true
    onDelete: CASCADE
    displayName:
      en: Product SKU
      ja: 商品SKU
      vi: SKU sản phẩm
    description:
      en: Null = wildcard override for all SKUs of this topping item
      ja: Null = このトッピング項目の全SKUへのワイルドカードオーバーライド
      vi: Null = override wildcard cho mọi SKU của topping item này

  is_hidden:
    type: Boolean
    default: false
    displayName:
      en: Is Hidden
      ja: 非表示
      vi: Ẩn
    description:
      en: Hide this topping item for this floating section product at shop level
      ja: ショップレベルでこのフローティングセクション商品のトッピング項目を非表示にする
      vi: Ẩn topping item này với floating section product này ở cấp shop

  override_price:
    type: Decimal
    precision: 15
    scale: 2
    nullable: true
    displayName:
      en: Override Price
      ja: 上書き価格
      vi: Giá ghi đè
    description:
      en: Shop override extra price. Null = inherit from HQ override or topping_group_item_skus
      ja: ショップの上書き追加価格。Null = HQ上書きまたはtopping_group_item_skusから継承
      vi: Giá extra ghi đè cấp shop. Null = kế thừa từ HQ override hoặc topping_group_item_skus
