# TableStatusChange schema
# Append-only log của mọi lần đổi runtime status của một Table.
# Tạo bởi TableStatusService::changeStatus trong cùng DB::transaction
# với Table::update.
#
# Không có updated_at, không có softDelete — đây là audit ledger.
# Không có hard FK đến User vì user_caches là cache SSO (giống pattern
# của WarehouseMember.user_id).
#
# Business Rules:
#   - BR-TSC01: Không bao giờ update / delete một row đã tạo
#   - BR-TSC02: from_status nullable (lần đổi đầu tiên có thể chưa có)
#   - BR-TSC03: changed_by_id phải là user thật từ SSO

displayName:
  en: Table Status Change
  ja: テーブル状態変更
  vi: Thay đổi trạng thái bàn

kind: object

options:
  timestamps: false
  id: Uuid
  indexes:
    - columns: [table_id, changed_at]

properties:
  from_status:
    type: EnumRef
    enum: TableStatus
    nullable: true
    displayName:
      en: From Status
      ja: 変更前
      vi: Trạng thái cũ
    description:
      en: "Previous status. Null on the very first transition (BR-TSC02)."
      ja: "前の状態。最初の遷移ではnull可（BR-TSC02）。"
      vi: "Trạng thái trước. Có thể null ở lần đổi đầu tiên (BR-TSC02)."

  to_status:
    type: EnumRef
    enum: TableStatus
    displayName:
      en: To Status
      ja: 変更後
      vi: Trạng thái mới

  changed_by_id:
    type: Uuid
    displayName:
      en: Changed By ID
      ja: 変更者ID
      vi: ID người đổi
    description:
      en: "References user_caches.id. No hard FK because user_caches is an SSO cache (BR-TSC03)."
      ja: "user_caches.idを参照。user_cachesはSSOキャッシュのためハードFKなし（BR-TSC03）。"
      vi: "Tham chiếu user_caches.id. Không có FK cứng vì user_caches là cache SSO (BR-TSC03)."

  changed_at:
    type: DateTime
    displayName:
      en: Changed At
      ja: 変更日時
      vi: Thời điểm đổi

  note:
    type: Text
    nullable: true
    displayName:
      en: Note
      ja: メモ
      vi: Ghi chú

  # Relationships
  table:
    type: Association
    relation: ManyToOne
    target: Table
    onDelete: CASCADE
    displayName:
      en: Table
      ja: テーブル
      vi: Bàn
