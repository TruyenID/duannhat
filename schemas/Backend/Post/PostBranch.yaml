# =============================================================================
# PostBranch (よくある質問×店舗 / Pivot câu hỏi × chi nhánh)
# =============================================================================
#
# Công tắc ẩn/hiện MỘT câu hỏi của HQ cho RIÊNG một chi nhánh (#1684).
#
# #1673 cho chi nhánh kế thừa FAQ của HQ bằng một công tắc CẢ CỤM
# (`branches.faq_inherit_hq`): nhận hết hoặc không câu nào. Bảng này làm nó mịn
# tới từng câu — người quản chi nhánh tắt đúng 2 câu không đúng với mình, thay
# vì tắt cả 20 rồi gõ tay lại 18 câu.
#
# **KHÔNG có dòng ⇒ CÒN HIỆN.** Chỉ ghi dòng khi chi nhánh chủ động tắt (hoặc
# bật lại thứ mình từng tắt). HQ thêm một câu mới cho 17 chi nhánh là **0 dòng
# ghi**, không phải backfill 17 dòng. Đây là cùng một lựa chọn với
# `PointRewardBranch` (#1514) và vì cùng một lý do.
#
# Vì sao có cột `is_visible` chứ không chỉ dựa vào sự tồn tại của dòng: một chi
# nhánh tắt rồi bật lại phải để lại dấu vết (`updated_by`, `updated_at`) — xoá
# dòng thì mất luôn ai tắt lúc nào, mà đó chính là câu hỏi HQ sẽ hỏi khi một
# câu quan trọng không hiện ở một cửa hàng.
#
# CỐ Ý CHỈ CÓ ẨN/HIỆN, KHÔNG CÓ SỬA LỜI. Cho chi nhánh sửa nội dung câu của HQ
# là rẽ nhánh nội dung: HQ sửa chính tả hay đổi chính sách thì 17 bản đã rẽ nằm
# lại ở lời cũ — hỏng đúng cái lý do có FAQ cấp HQ. Muốn khác lời thì tắt câu
# HQ rồi tự thêm câu riêng của chi nhánh (`posts.branch_id`, đã có từ #1673).
#
# Written by:  ShopFaqController::visibility() — màn Shop
#              (`PATCH /shops/{shop}/faqs/{faq}/visibility`).
#              HQ KHÔNG ghi bảng này; HQ ẩn một câu với MỌI chi nhánh bằng
#              `posts.status` (BR-FB03).
# Read by:     ShopFaqController::index() (hiện trạng thái công tắc cho người
#              quản chi nhánh) và CustomerPostController::index() (loại câu bị
#              tắt khỏi trang khách).
# Lifecycle:   CASCADE cả 2 phía. Xoá câu hỏi hoặc chi nhánh thì công tắc cũng
#              hết nghĩa.
#
# Business Rules:
#   - BR-FB01: Không có dòng ⇒ hiện. Truy vấn phải là LEFT JOIN /
#              `whereDoesntHave`, KHÔNG phải INNER JOIN — inner join sẽ làm MỌI
#              câu của HQ biến mất ở MỌI chi nhánh chưa từng tắt gì.
#   - BR-FB02: `branches.faq_inherit_hq = false` thắng tuyệt đối. Chi nhánh đã
#              tắt cả cụm thì công tắc từng câu không còn nghĩa gì.
#   - BR-FB03: Câu HQ đang ẩn với khách (`posts.status != published`) không hiện
#              ở chi nhánh nào, bất kể dòng ghi đè nói gì. Cấp trên luôn thắng —
#              cùng luật với BR-PRB02 của `PointRewardBranch`.
#   - BR-FB04: Chỉ áp cho câu CẤP TỔ CHỨC (`posts.branch_id IS NULL`). Câu riêng
#              của chi nhánh đã có `posts.status` của chính nó; ghi thêm dòng ở
#              đây là hai công tắc cho cùng một việc.
# =============================================================================

displayName:
  en: Post Branch
  ja: 投稿店舗
  vi: Câu hỏi theo chi nhánh

kind: pivot
pivotFor: [Post, Branch]

options:
  # KHAI TƯỜNG MINH, đừng bỏ. Bỏ trống thì migration sinh ra bảng
  # `branch_post_pivot` trong khi model sinh ra lại ghi `$table = 'post_branches'`
  # — hai tên khác nhau, và mọi truy vấn qua model chết bằng "table doesn't
  # exist". Xem ghi chú cùng chỗ ở `PointRewardBranch.yaml`.
  tableName: post_branches
  timestamps: true
  # CỐ Ý KHÔNG dùng `audit: createdBy/updatedBy` (#1689).
  #
  # `AuditConfig` của Omnify sinh cột `bigint unsigned` cứng, không có tuỳ chọn
  # kiểu khoá — mà `users.id` ở repo này là `char(36)` (UUID). Nhét UUID vào cột
  # bigint thì MySQL truncate và MỌI lần ghi đều chết:
  #
  #   SQLSTATE[01000]: Warning: 1265 Data truncated for column 'created_by_id'
  #
  # Và nó chết ở đúng chỗ test không nhìn thấy: test chạy sqlite, vốn có kiểu
  # động, nên chuỗi UUID vào cột INTEGER không kêu một tiếng nào. 870 test xanh
  # trong khi tính năng chết sạch trên MySQL.
  #
  # Hai `Association` dưới đây sinh đúng cột UUID với đúng tên
  # (`created_by_id` / `updated_by_id`). Đổi lại: hook auto-fill đi kèm `audit`
  # cũng mất, nên `ShopFaqController::visibility()` phải tự điền — xem ở đó.
  indexes:
    - columns: [post_id, branch_id]
      unique: true
      name: post_branch_unique
    # BR-FB01 — truy vấn FAQ lọc theo chi nhánh rồi mới tới cờ.
    - columns: [branch_id, is_visible]

properties:
  # Người bấm công tắc gần nhất. MỘT cột, không phải cặp created/updated: dòng
  # này chỉ có một hành động duy nhất (bật hoặc tắt), nên "ai tạo dòng" và "ai
  # sửa lần cuối" là cùng một câu hỏi. `created_at`/`updated_at` lo phần "lúc nào".
  #
  # Tên KHÁC `created_by_id`/`updated_by_id` là có chủ đích: hai cột kia đã tồn
  # tại dưới dạng `bigint` (do `audit` sinh ra trước khi #1689 phát hiện sai
  # kiểu). Dùng lại đúng tên đó thì generator phát ra migration tự mâu thuẫn —
  # `addColumn` có guard `hasColumn` nên bị bỏ qua, rồi `dropColumn` ở cuối xoá
  # luôn, kết cục là mất cột mà không thêm lại được. Tên mới thì drop và add là
  # hai cột khác nhau, không đụng nhau.
  #
  # SET NULL chứ không RESTRICT: xoá một nhân viên nghỉ việc không được phép bị
  # chặn chỉ vì họ từng bấm tắt một câu hỏi.
  toggledBy:
    type: Association
    relation: ManyToOne
    target: User
    nullable: true
    onDelete: SET NULL
    displayName:
      en: Toggled By
      ja: 切替者
      vi: Người bấm

  is_visible:
    # BR-FB01 — dòng tồn tại mà cờ true nghĩa là "đã từng tắt, nay bật lại".
    type: Boolean
    default: true
    filterable: true
    displayName:
      en: Visible
      ja: 表示中
      vi: Đang hiện
