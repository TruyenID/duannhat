    label: { en: Cash, ja: 現金, vi: Tiền mặt }
  - value: card
    label: { en: Card, ja: カード, vi: Thẻ }
  - value: wallet
    label: { en: Wallet, ja: ウォレット, vi: Ví điện tử }
  - value: qr
    label: { en: QR Payment, ja: QR決済, vi: Thanh toán QR }
  - value: e_money
    label: { en: E-Money, ja: 電子マネー, vi: Tiền điện tử }
  - value: bank_transfer
    label: { en: Bank Transfer, ja: 銀行振込, vi: Chuyển khoản }
