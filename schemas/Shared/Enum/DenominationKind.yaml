# ==============================================================================
# Denomination Kind Enum (額面種別 / Loại mệnh giá)
# ==============================================================================
#
# Plan 030 — Cashier Shift.
#
# Phân biệt note (tiền giấy) và coin (tiền xu) để UI gom nhóm khi đếm:
# notes trước (mệnh giá lớn), rồi coins (mệnh giá nhỏ). Bám ARTS
# `Denomination.tenderDenominationCode` ("Banknote" / "Coin").
#
# Seeded data (xem TillTenderTypeSeeder / DenominationSeeder):
#   JPY: 10000/5000/2000/1000 note · 500/100/50/10/5/1 coin
#   VND: 500000/200000/100000/50000/20000/10000/5000/2000/1000 note
#   USD: 100/50/20/10/5/1 note · 0.25/0.10/0.05/0.01 coin
#   EUR: 500/200/100/50/20/10/5 note · 2/1/0.50/0.20/0.10/0.05/0.02/0.01 coin
#
# Used in:
#   - Denomination.kind
#   - TillCashDenominationCount.denomination_kind (snapshot)
#   - UI ordering: notes-then-coins.
# ==============================================================================

kind: enum

displayName:
  ja: 額面種別
  en: Denomination Kind
  vi: Loại mệnh giá

values:
  - value: note
    label: { ja: 紙幣, en: Note, vi: Tiền giấy }
  - value: coin
    label: { ja: 硬貨, en: Coin, vi: Tiền xu }
