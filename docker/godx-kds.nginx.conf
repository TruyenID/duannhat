server {
  listen 5460 default_server;
  listen [::]:5460 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HTTPS upgrade — see pos-web.nginx.conf for full rationale.
  set $force_https 0;
  if ($http_x_forwarded_proto = "http") { set $force_https 1; }
  if ($host ~ "\.local$|^localhost(:[0-9]+)?$|^127\.0\.0\.1") { set $force_https 0; }
  if ($force_https = 1) {
    return 308 https://$host$request_uri;
  }

  # SPA fallback — KDS is a Vite SPA, client-side router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # PWA service worker — never cache so updates propagate
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  server_tokens off;
}
