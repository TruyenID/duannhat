; OPcache cho dev — bind mount vào /usr/local/etc/php/conf.d/opcache.ini
;
; BẮT BUỘC enable_cli=1 vì compose dùng `php -S` (CLI server). Tắt cái này
; thì mỗi request Laravel parse lại 500+ file PHP từ disk → trên Windows
; bind mount sẽ delay 5–15 giây/request, kể cả khi opcache.enable=1.
;
; validate_timestamps=1 + revalidate_freq=0 để code vẫn reload ngay khi sửa
; file (chỉ stat() chứ không parse → vẫn cực nhanh).

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; File cache: persist bytecode ra tmpfs nội container (KHÔNG bind mount).
; Sau khi restart container, request đầu cũng đã có cache → không cold start.
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0

; Realpath cache to → giảm số lần stat() qua bind mount cho app/, routes/, views.
realpath_cache_size=8192K
realpath_cache_ttl=600
