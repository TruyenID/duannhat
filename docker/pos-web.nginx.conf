server {
  listen 5440 default_server;
  listen [::]:5440 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # frame-ancestors must be set via HTTP header (browsers ignore it from
  # <meta>). Block embedding pos-web in any iframe — clickjacking defense.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;

  # HTTPS upgrade — if Cloudflare Tunnel forwarded an HTTP request (some
  # ephemeral tunnels don't auto-redirect), bounce the browser to HTTPS.
  # LAN access via http://*.tempo.local is exempted by checking the Host.
  set $force_https 0;
  if ($http_x_forwarded_proto = "http") { set $force_https 1; }
  if ($host ~ "\.local$|^localhost(:[0-9]+)?$|^127\.0\.0\.1") { set $force_https 0; }
  if ($force_https = 1) {
    return 308 https://$host$request_uri;
  }

  # SPA fallback — pos-web is a Vite SPA, all routes resolved client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames → long cache. index.html stays fresh so a redeploy
  # invalidates the bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # gzip — Vite bundles compress ~4x.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # Drop server token to avoid leaking nginx version.
  server_tokens off;
}
