server {
  listen 5480 default_server;
  listen [::]:5480 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HTTPS upgrade — see pos-web.nginx.conf for full rationale.
  set $force_https 0;
  if ($http_x_forwarded_proto = "http") { set $force_https 1; }
  if ($host ~ "\.local$|^localhost(:[0-9]+)?$|^127\.0\.0\.1") { set $force_https 0; }
  if ($force_https = 1) {
    return 308 https://$host$request_uri;
  }

  # SPA fallback — Expo Router uses client-side navigation
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;
}
