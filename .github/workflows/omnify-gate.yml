            'workstation/**', 'VERSION',
            # #3002 — xem khối cùng số hiệu ở trigger `push` bên trên. Mỗi
            # trigger phải TỰ phủ đủ: bản sao bên kia không che cho bản này
            # (lý do đã ghi trong `gate-paths-cover-its-guards.test.mjs`).
            #
