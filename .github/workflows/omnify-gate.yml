            # #3065 — `.github/scripts/**` PHẢI ở đây, không chỉ `workflows/**`.
            # Bốn rào (`ws-publish`, `ws-manifest*`, `version-single-source`) và
            # monitor `version-drift` đều đọc script trong thư mục đó, nhưng bộ
            # lọc chỉ cho chúng thấy file workflow — nên một PR chỉ sửa
            # `publish-workstation-downloads.sh` đi qua gate với 0 rào chạy.
            # Cùng hình dạng #2959/#2971, lần thứ tư.
            '.github/scripts/**',
            # #2959 — `workstation/**` và `VERSION` PHẢI nằm đây.
            #
            # Rào `test:version-fleet` phát biểu: "delta chạm workstation/ thì
            # VERSION phải đổi". Nhưng bộ lọc paths cũ KHÔNG chứa workstation/,
            # nên một PR chỉ chạm thư mục đó — tức đúng loại PR rào sinh ra để
            # canh — không kích hoạt workflow này và rào không chạy.
            #
            # Đo được: 23 file workstation/ lên main qua promote #2957 mà không
            # CI nào đỏ, trong khi chạy tay chính bài test đó thì ĐỎ.
            #
            # Cùng hình dạng với #2874 (phép kiểm lease nằm ở đường merge ít bị
            # dùng nhất): rào ĐÚNG mà KHÔNG CHẠY thì đọc log CI y hệt rào đúng
            # và có chạy. Một rào phát biểu về thư mục X bắt buộc phải chạy khi
            # X đổi, nếu không nó chỉ là một câu văn.
            'workstation/**', 'VERSION',
            # #3002 — cùng hình dạng, lần thứ NĂM. `test:app-gates` phát biểu
            # "app có test thì phải có cổng", và nó đọc đúng hai thứ: danh sách
            # thư mục cấp hai dưới `app/`+`web/` kèm `package.json` của chúng,
            # và nội dung workflow. Vế sau đã có `.github/workflows/**`; vế
            # ĐẦU thì không — nên PR thêm một app mới (đúng loại PR rào sinh ra
            # để canh) không kích hoạt gate này và rào không chạy.
            #
            # Đo trực tiếp: một PR chỉ thêm `app/newapp/package.json` khớp 0
            # workflow có gọi `test:app-gates`.
            #
            # Ghim `*/package.json` chứ không phải `app/**`: đó ĐÚNG là thứ rào
            # đọc (thêm app, xoá app, hay thêm script `test` đều buộc phải chạm
            # file này), nên gate không phải chạy lại cho mọi thay đổi mã nguồn
            # của tám app.
            #
            # #3133 — MỘT mẫu `*/*/package.json` thay cho hai mẫu ghim nhóm.
            # `test:app-gates` không còn duyệt `["app", "web"]` gõ cứng (chính
            # cái đó làm `workstation/frontend` vô hình với nó suốt nhiều
            # tháng), nó đọc MỌI thư mục cấp hai có `package.json`. Bộ lọc phải
            # rộng đúng bằng phép liệt kê, nếu không nhóm thứ tư lại lọt y hệt.
            '*/*/package.json',
            # #3200 — rào `test:ws-feed-caps` đọc HAI cây: controller Workstation
            # phía Cloud (nơi `->limit()` sinh ra lớp lỗi) và hai file Go giữ
            # hằng số phản chiếu. Không có hai mẫu này thì PR thêm một trần mới
            # — đúng loại PR rào sinh ra để canh — khớp 0 workflow gọi nó, và ta
            # lặp lại y hệt #2971.
            'backend/app/Http/Controllers/Api/V1/Workstation/**',
            'workstation/internal/service/sync_pull*.go',
            # Rào `test:ws-expected` phát biểu về đường đi của con số "quán nên
            # ở bản nào": file gốc cây → `.env` production, trước `config:cache`.
            # File này CỐ Ý không nằm trong `workstation/` (vòng tròn #3145 với
            # `test:version-fleet`), nên không mẫu nào có sẵn với tới nó — thiếu
            # dòng dưới thì PR bump fleet, đúng loại PR rào sinh ra để canh,
            # khớp 0 workflow gọi nó. Cùng hình dạng #2959/#2971/#3200.
            # #3229 — rào `test:buildspecs-uploaded` phát biểu "mọi buildspec
            # phải có workflow nạp nó lên Amplify". PR thêm một buildspec mồ côi
            # — đúng loại PR rào sinh ra để canh — chỉ chạm thư mục này, nên
            # thiếu mẫu dưới đây thì nó khớp 0 workflow gọi rào. Cùng hình dạng
            # #2959/#2971/#3200; lần này `test:gate-paths` bắt được ngay lượt đầu.
            '.github/amplify/**',
            'WORKSTATION_EXPECTED_VERSION']
  pull_request:
    branches: [dev, main]
    paths: ['.omnify/**', 'scripts/**', 'schemas/**', 'omnify.yaml', 'package.json', 'package-lock.json', # #2971 — CẢ THƯ MỤC, không phải hai file lẻ. `workflows-parse`
            # canh cú pháp MỌI workflow, nhưng bộ lọc cũ chỉ cho nó nhìn
