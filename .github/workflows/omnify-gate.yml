# #2363 — the Omnify guards used to run only in the dev-to-main full suite.
# A PR changing the guard itself or its state files therefore reported no checks.
name: omnify-gate

on:
  push:
    branches: [dev, main]
    paths: ['.omnify/**', 'scripts/**', 'schemas/**', 'omnify.yaml', 'package.json', 'package-lock.json', # #2971 — CẢ THƯ MỤC, không phải hai file lẻ. `workflows-parse`
            # canh cú pháp MỌI workflow, nhưng bộ lọc cũ chỉ cho nó nhìn
